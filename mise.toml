#:schema https://mise.jdx.dev/schema/mise.json
# mise owns the task graph. Every other tool is invoked from a task here, so the local gate and
# the CI gate cannot drift apart.
min_version = "2026.11.9"

[settings]
# Keep mise.lock current as tools change; `mise lock` regenerates it for exactly these platforms,
# so a fresh `mise install` never rewrites it. Windows is listed because CI builds and tests
# there (installing only Rust).
lockfile = true
lockfile_platforms = ["macos-arm64", "macos-x64", "linux-x64", "linux-arm64", "windows-x64"]

[tools]
"github:markmals/workbench" = "3.0.1"
# hk's version must match the `amends`/`import` URLs in hk.pkl — bump both together.
hk = "2.8.1"
gh = "2.103.2"
# Beads is not in the mise registry; the GitHub release backend installs the same binary
# `brew install beads` does. Pin it: an older `bd` refuses to open a newer database.
"github:gastownhall/beads" = "1.3.2" # provides `bd`
actionlint = "1.7.12"
dprint = "0.64.3"
worktrunk = "0.81.0" # provides `wt`
"github:knope-dev/knope" = { version = "0.24.0", version_prefix = "knope/v" }
"github:dmno-dev/varlock" = "1.25.0"
# hk's `cargo_fmt` and `cargo_clippy` steps need both components on every machine, CI included.
# rust-toolchain.toml pins the same toolchain for rustup; change both together.
rust = { version = "1.100.0", components = "rustfmt,clippy" }
# The website and installer Worker share Node. pnpm matches `packageManager` in site/package.json.
node = "26.13.1"
pnpm = "12.21.0"

[hooks]
postinstall = 'ln -sfn "$(mise where github:markmals/workbench)" "{{config_root}}/.workbench"'

[env]
# The website's CLIs (astro, oxfmt, oxlint, eslint, tsrs, wrangler) by bare name, for tasks, hk
# and `mise exec`.
_.path = ["{{config_root}}/site/node_modules/.bin"]
ASTRO_TELEMETRY_DISABLED = "1"
WRANGLER_SEND_METRICS = "false"

# ── The task interface every Workbench project implements ────────────────────

[tasks.setup]
description = "Idempotent first-run bootstrap: crates, the website's npm packages and test browser, this machine's Beads replica, git hooks"
depends = ["site:deps", "site:e2e:install"]
run = [
    # Downloads every crate Cargo.lock names, failing if the lockfile is out of date.
    "cargo fetch --locked",
    # A project that already has a Beads workspace restores this machine's replica from the
    # remote's `refs/dolt/data`; only a project without one creates it. `--skip-hooks` is
    # load-bearing: without it `bd init` points core.hooksPath at .beads/hooks, and every hook
    # hk installs is then ignored by git.
    "if [ -f .beads/config.yaml ]; then bd bootstrap --yes; else bd init --non-interactive --prefix pkg --skip-agents --skip-hooks; fi",
    # Commit `.beads/issues.jsonl` so the work graph is reviewable in a diff.
    "bd config set export.auto true",
    # Syncs happen at the process's sync points (`mise run beads:sync`).
    "bd config set dolt.auto-push false",
    # hk owns every git hook (see hk.pkl). Never run `bd hooks install`.
    "hk install --mise",
]

[tasks.check]
description = "The single blocking gate: tests, rustdoc, the website's build, browser tests and checks, formatting, Clippy, workflows, records"
alias = "c"
# `hk check --all` runs every step in hk.pkl: whitespace, newlines, merge conflicts, actionlint,
# dprint, rustfmt, Clippy over every target with warnings as errors, and the website's Oxfmt,
# Oxlint, ESLint and type checks.
depends = ["test", "doc", "installer:worker:test", "site:check"]
run = ["hk check --all", "mise run validate"]

[tasks.fmt]
alias = "f"
description = "Format in place with hk's fixers (dprint, rustfmt, Oxfmt, Oxlint, ESLint); accepts file paths, all files when none"
usage = 'arg "[files]" help="Files to format" var=#true'
run = "hk fix ${usage_files:---all}"

[tasks.status]
description = "Where the work stands: current phase, next action, who acts, and Beads"
run = "workbench workflow status --output text"

[tasks.validate]
description = "Check the project's records and its Workbench setup"
run = ["workbench records validate --output text", "workbench project validate --output text"]

[tasks."beads:sync"]
description = "Sync this machine's Beads replica with the project's remote"
run = "workbench beads sync --output text"

[tasks."beads:claim"]
description = "Claim a Beads item as this machine and confirm the claim survived a sync: `mise run beads:claim -- <id>`"
run = "workbench beads claim --output text"

[tasks."beads:close"]
description = """Close a Beads item as this machine's claimant, then sync: `mise run beads:close -- <id> --reason "<reason>"`"""
run = "workbench beads close --output text"

# ── The CLI ──────────────────────────────────────────────────────────────────

[tasks.build]
alias = "b"
description = "Build the CLI, reusable library, and release helper"
run = "cargo build --workspace --locked"

[tasks.test]
alias = "t"
description = "Run library tests and tests that run the CLI binary"
run = "cargo test --workspace --locked"

[tasks.lint]
alias = "l"
description = "Clippy over every target, warnings are errors (hk runs the same check)"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.doc]
description = "Build the rustdoc; any warning is an error"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --workspace --no-deps --locked"

[tasks.dev]
alias = "d"
description = "Run the CLI from source: `mise run dev -- search ffmpeg`; changes reach your real config, so preview them with --dry-run"
run = "cargo run --quiet --package pkg --"

[tasks."cli:reference"]
description = "Regenerate crates/pkg/docs/cli.md from the command registry"
env = { PKG_UPDATE_REFERENCE = "1" }
run = "cargo test --package pkg --test cli reference"

# ── The website (site/) ──────────────────────────────────────────────────────
# The landing page and the Starlight docs under /docs: Astro on Cloudflare Workers, its own pnpm
# project. Its tasks run in site/ and find its CLIs through `_.path`. None deploys: a deployment
# waits for a human's go-ahead, a Cloudflare account and a chosen domain.

[tasks."site:deps"]
description = "Install the website's npm packages from site/pnpm-lock.yaml"
dir = "{{config_root}}/site"
run = "pnpm install --frozen-lockfile"

[tasks."site:dev"]
description = "Serve the website with live reload in workerd on port 4327, on every network interface"
depends = ["site:deps"]
dir = "{{config_root}}/site"
# `--ignore-lock` keeps Astro in the foreground: it backgrounds itself when it detects an agent.
run = "astro dev --host 0.0.0.0 --port 4327 --ignore-lock"

[tasks."site:build"]
description = "Build the website into site/dist/: every page and the docs search index, prerendered in workerd"
depends = ["site:deps"]
dir = "{{config_root}}/site"
# Cached Markdown can reference deleted syntax CSS after an imported theme changes.
run = "astro build --force"

[tasks."site:preview"]
description = "Rebuild the website and serve the production build in workerd on port 4328, on every network interface"
depends = ["site:build"]
dir = "{{config_root}}/site"
run = "astro preview --host 0.0.0.0 --port 4328 --ignore-lock"

[tasks."site:check"]
description = "The website's gate: the production build, Playwright against it in workerd, then Oxfmt, Oxlint, ESLint and the type checks"
depends = ["site:build", "site:e2e"]
dir = "{{config_root}}/site"
run = ["oxfmt --check", { task = "site:lint" }, { task = "site:typecheck" }]

[tasks."site:e2e"]
description = "Run Playwright against the website's production build served by workerd"
depends = ["site:build", "site:e2e:install"]
dir = "{{config_root}}/site"
run = "playwright test"

[tasks."site:e2e:install"]
description = "Install Playwright's Chromium (and, in CI, its system libraries)"
depends = ["site:deps"]
dir = "{{config_root}}/site"
run = "playwright install ${CI:+--with-deps} chromium"

[tasks."site:fmt"]
description = "Format and fix the website's files with hk's fixers (dprint, Oxfmt, Oxlint, ESLint)"
run = "hk fix --all --glob 'site/**'"

[tasks."site:lint"]
description = "Lint the website: Oxlint (type-aware; TypeScript and .astro scripts) and ESLint (.astro templates)"
dir = "{{config_root}}/site"
run = ["oxlint --deny-warnings", "eslint --max-warnings 0 ."]

[tasks."site:typecheck"]
description = "Type-check the website: astro check for .astro files, tsrs for .ts and .tsx"
dir = "{{config_root}}/site"
# `astro check` also generates site/.astro/types.d.ts, which site/tsconfig.json includes.
run = ["astro check --tsconfig tsconfig.astro.json", "tsrs"]

# ── Releases ─────────────────────────────────────────────────────────────────

[tasks.package]
description = "Build the release archive for one target into artifacts/ (default: this machine)"
usage = 'arg "[target]" help="A Rust target triple, such as aarch64-apple-darwin"'
run = "cargo xtask package {{usage.target}}"

[tasks.preview]
description = "Build a local CLI archive and a source archive for a private library preview"
depends = ["package"]
run = "git archive --format=tar.gz --prefix=pkg-source/ --output=artifacts/pkg-core-source.tar.gz HEAD"

[tasks."release:installer"]
description = "Write the installer for this version, which gotpkg.dev serves, to artifacts/install.sh"
run = "cargo xtask installer"

[tasks."release:checksums"]
description = "Write the SHA-256 manifest of the archives in artifacts/ to artifacts/SHA256SUMS"
run = "cargo xtask checksums"

[tasks."installer:worker:test"]
description = "Test the stub Worker that serves the installer at gotpkg.dev until the site does"
run = "node --test 'installer/worker/*.test.js'"

[tasks."installer:worker:deploy"]
description = "Deploy the stub Worker to gotpkg.dev (needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID)"
# wrangler reads both from the environment; Varlock checks them against .env.schema and redacts them.
run = "varlock run --filter CLOUDFLARE_API_TOKEN,CLOUDFLARE_ACCOUNT_ID -- npx --yes wrangler@4.163.0 deploy --config installer/worker/wrangler.jsonc"

[tasks.release]
description = "Publish the GitHub release with the archives, installer and SHA256SUMS in artifacts/ (release.yml runs this)"
# `knope release` reads GITHUB_TOKEN; Varlock checks it against .env.schema and redacts it.
# `--filter` loads that item alone, so another component's required items in a merged
# .env.schema never block a release.
run = "varlock run --filter GITHUB_TOKEN -- knope release --verbose"
