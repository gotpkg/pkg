[package]
name = "pkg"
# Knope owns this version (knope.toml); change it only through a release.
version = "0.0.0"
edition.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Install, remove, and find packages and tools with mise, and record each one in your mise config"

# The library holds the commands so tests can reach the registry and parser in-process; the
# binary is a shell around `pkg::app::run`.
[lib]
name = "pkg"
path = "src/lib.rs"

[[bin]]
name = "pkg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["string"] }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` writes JSON fields in declaration order: `status` before the rest of a receipt,
# and an error's `code` and `message` before its `details`.
serde_json = { version = "1.0", features = ["preserve_order"] }
# Reads mise config files without losing their formatting or comments.
toml_edit = "0.25"
# Blocking HTTPS for the Homebrew and App Store catalogs; rustls, so no system TLS library.
ureq = "3.5"

[dev-dependencies]
jsonschema = { version = "0.61", default-features = false }
tempfile = "3.27"

[lints]
workspace = true
