[package]
name = "pkg"
# Knope owns this version (knope.toml); change it only through a release.
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Install, remove, and find packages and tools with mise, and record each one in your mise config"

# The library holds the commands so tests can reach the registry and parser in-process; the
# binary is a shell around `pkg::app::run`.
[lib]
name = "pkg"
path = "src/lib.rs"

[[bin]]
name = "pkg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["string"] }
# Draws the live progress display of `install`, `update`, `sync`, `remove` and `prune` on a
# terminal; only `src/progress/display.rs` uses it.
indicatif = "0.18"
pkg-core = { path = "../pkg-core" }
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
# `preserve_order` writes JSON fields in declaration order: `status` before the rest of a receipt,
# and an error's `code` and `message` before its `details`.
serde_json = { version = "1.0", features = ["preserve_order"] }

[dev-dependencies]
# The in-memory terminal the display's tests draw on.
indicatif = { version = "0.18", features = ["in_memory"] }
jsonschema = { version = "0.61", default-features = false }
tempfile = "3.27"

# The pseudo-terminal that tests run the binary's stderr on.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[lints]
workspace = true
