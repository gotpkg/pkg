[package]
name = "pkg-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Typed package operations backed by mise and package catalogs"

[dependencies]
schemars = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
toml_edit = "0.25"
ureq = "3.5"

[dev-dependencies]
tempfile = "3.27"

[lints]
workspace = true
