# Merging Knope's release pull request is the explicit release authorization the process
# requires. This workflow runs the gate and builds, smoke-tests and attests the five archives,
# then writes the installer and the archives' SHA256SUMS manifest and installs pkg with them;
# only when all of that passes does `knope release` tag `v<version>` and publish the GitHub
# release with the archives, the installer, the manifest and the changelog entry. This CLI has no
# irreversible registry publish, so the GitHub release is the last irreversible step. The check
# that gotpkg.dev serves the new installer follows it, only when the repository variable
# GOTPKG_DOMAIN is `true`.
#
# Credentials: `knope release` uses the workflow's built-in GITHUB_TOKEN (contents: write on that
# job only).

name: Release

on:
    pull_request:
        types: [closed]
        branches: [main]

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # Only the merge of Knope's own release branch, from this repository, releases.
    authorize:
        name: Authorize the release
        if: >-
            github.head_ref == 'release'
            && github.event.pull_request.merged == true
            && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - run: echo "Knope's release pull request from this repository was merged."

    # The same gate CI runs, on the merged commit, before anything is tagged or published.
    check:
        name: Check
        needs: authorize
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            - run: mise run check

    build:
        needs: authorize
        uses: ./.github/workflows/build-archives.yml
        permissions:
            contents: read
            id-token: write
            attestations: write

    release:
        name: Publish the GitHub release
        needs: [check, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            version: ${{ steps.installer.outputs.version }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@v8.0.2
              with:
                  path: artifacts
                  pattern: pkg-*
                  merge-multiple: true
            - uses: jdx/mise-action@v5
              with:
                  cache: false
            # install.sh embeds this release's version; SHA256SUMS covers the archives it installs.
            - name: Write the installer and SHA256SUMS
              id: installer
              run: |
                  mise run release:installer
                  mise run release:checksums
                  echo "version=$(sed -n 's/^release_version="\(.*\)"$/\1/p' artifacts/install.sh)" >> "$GITHUB_OUTPUT"
            # The installer as a new Linux user runs it, against these assets served from disk:
            # it checks the archive against SHA256SUMS and runs the installed pkg.
            - name: Install pkg with the installer
              env:
                  VERSION: ${{ steps.installer.outputs.version }}
              run: |
                  releases="$RUNNER_TEMP/releases"
                  mkdir -p "$releases/download" "$RUNNER_TEMP/home"
                  ln -s "$PWD/artifacts" "$releases/download/v$VERSION"
                  HOME="$RUNNER_TEMP/home" SHELL=/bin/bash PKG_RELEASES_URL="file://$releases" \
                      sh artifacts/install.sh
            - run: mise run release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Opt in with the repository variable GOTPKG_DOMAIN = `true` once a Worker serves gotpkg.dev.
    # It serves the latest release's install.sh and may cache it for five minutes, so this job
    # waits that long for both routes to serve this release's installer. Without the variable this
    # job is skipped, not failed.
    installer-domain:
        name: Check the installer at gotpkg.dev
        needs: release
        if: vars.GOTPKG_DOMAIN == 'true'
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Wait for gotpkg.dev to serve this release's installer
              env:
                  VERSION: ${{ needs.release.outputs.version }}
              run: |
                  if [ -z "$VERSION" ]; then
                      echo "::error::The release job reported no version."
                      exit 1
                  fi
                  embedded_version() {
                      curl -fsSL "$1" | sed -n 's/^release_version="\(.*\)"$/\1/p'
                  }
                  deadline=$(($(date +%s) + 300))
                  while :; do
                      root="$(embedded_version https://gotpkg.dev || true)"
                      script="$(embedded_version https://gotpkg.dev/install.sh || true)"
                      if [ "$root" = "$VERSION" ] && [ "$script" = "$VERSION" ]; then
                          echo "gotpkg.dev serves the installer for pkg $VERSION."
                          exit 0
                      fi
                      if [ "$(date +%s)" -ge "$deadline" ]; then
                          echo "::error::After five minutes, https://gotpkg.dev serves the installer for '${root:-nothing}' and https://gotpkg.dev/install.sh for '${script:-nothing}', not pkg $VERSION."
                          exit 1
                      fi
                      sleep 15
                  done
